apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-booking-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-booking-frontend
  template:
    metadata:
      labels:
        app: doctor-booking-frontend
    spec:
      containers:
        - name: frontend
          image: revan02/doctor-booking-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
